name: Publish site

# The site is plain HTML, CSS and JavaScript, published as it is — plus two data files made here:
#   data/ski.pmtiles — the world's ski runs, lifts and ski areas (OpenSkiMap's daily OpenStreetMap
#                      extract; tools/build-ski.sh). Quick: rebuilt once a week, reused in between.
#   data/sea.pmtiles — the world's sea marks (641k marks), built from QLever's OpenStreetMap endpoint
#                      (tools/build-sea.mjs qlever + tools/build-sea.sh) and stored in parts on the
#                      sea-data branch (tools/publish-sea.sh); joined here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays: fresh ski data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Install tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe

      # Ski runs: cached for the week.
      - id: ski
        uses: actions/cache@v4
        with:
          path: data/ski.pmtiles
          key: ski-${{ steps.week.outputs.key }}-${{ hashFiles('tools/build-ski.py', 'tools/build-ski.sh') }}
      - name: Build the ski tiles
        if: steps.ski.outputs.cache-hit != 'true'
        run: tools/build-ski.sh /tmp/ski data/ski.pmtiles

      # Sea marks: kept in parts on the sea-data branch (tools/publish-sea.sh), joined here.
      - uses: actions/checkout@v4
        with:
          ref: sea-data
          path: sea-data
      - name: Join the sea tiles
        run: cat sea-data/sea.pmtiles.part* > data/sea.pmtiles && rm -rf sea-data && ls -la data/sea.pmtiles

      # Pages has to be switched on once by hand: Settings → Pages → Source: "GitHub Actions".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
