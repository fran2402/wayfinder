name: Build sea marks

# The world's sea marks from OpenStreetMap, in two queries to QLever's OpenStreetMap planet endpoint
# (University of Freiburg; a few minutes), made into data/sea.pmtiles. Publishing the site picks that
# file up (see pages.yml) and runs as soon as this finishes.
on:
  schedule:
    - cron: "41 1 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sea
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
      - name: Fetch the world's sea marks
        run: node --max-old-space-size=6000 tools/build-sea.mjs qlever sea-cells
      - name: Build the tiles
        run: tools/build-sea.sh sea-cells data/sea.pmtiles
      - name: Keep the tiles
        uses: actions/cache/save@v4
        with:
          path: data/sea.pmtiles
          key: seatiles-${{ github.run_id }}
