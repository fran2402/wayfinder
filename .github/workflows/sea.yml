name: Build sea marks

# The world's sea marks from OpenStreetMap, gathered a piece at a time: each run fetches the 10° cells
# that are missing or oldest for up to 2½ hours (the public Overpass servers are often busy), keeps
# them for the next run, and makes data/sea.pmtiles from everything gathered so far. Publishing the
# site picks that file up (see pages.yml) and runs as soon as this finishes.
on:
  schedule:
    - cron: "41 1 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sea
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Install tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
      - name: Saved cells
        uses: actions/cache/restore@v4
        with:
          path: sea-cells
          key: sea-cells-${{ github.run_id }}
          restore-keys: sea-cells-
      - name: Fetch more cells
        run: node tools/build-sea.mjs crawl sea-cells 150
      - name: Keep the cells
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sea-cells
          key: sea-cells-${{ github.run_id }}
      - name: Build the tiles
        run: tools/build-sea.sh sea-cells data/sea.pmtiles
      - name: Keep the tiles
        uses: actions/cache/save@v4
        with:
          path: data/sea.pmtiles
          key: seatiles-${{ github.run_id }}
